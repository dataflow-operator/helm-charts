{{- if and .Values.gui.enabled .Values.rbac.create .Values.gui.serviceAccount.create (not .Values.gui.serviceAccount.name) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dataflow-operator.gui.fullname" . }}-binding
  labels:
    {{- include "dataflow-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dataflow-operator.gui.fullname" . }}-role
subjects:
- kind: ServiceAccount
  name: {{ include "dataflow-operator.gui.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
