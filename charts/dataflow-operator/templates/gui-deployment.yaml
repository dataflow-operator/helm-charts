{{- if .Values.gui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataflow-operator.gui.fullname" . }}
  labels:
    {{- include "dataflow-operator.gui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gui.replicaCount }}
  selector:
    matchLabels:
      {{- include "dataflow-operator.gui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dataflow-operator.gui.selectorLabels" . | nindent 8 }}
    spec:
      {{- with (include "dataflow-operator.imagePullSecrets" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "dataflow-operator.gui.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with (include "dataflow-operator.nodeScheduling" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
      - name: gui
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.gui.image.repository | default .Values.image.repository }}:{{ .Values.gui.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.gui.image.pullPolicy | default .Values.image.pullPolicy }}
        command:
        - /app/server
        args:
        - --bind-address=:{{ .Values.gui.port }}
        {{- if .Values.gui.logLevel }}
        - --log-level={{ .Values.gui.logLevel }}
        {{- end }}
        env:
        - name: OPERATOR_METRICS_URL
          value: "http://{{ include "dataflow-operator.fullname" . }}:{{ .Values.service.port }}/metrics"
        {{- if and .Values.gui.prometheus .Values.gui.prometheus.url }}
        - name: PROMETHEUS_URL
          value: {{ .Values.gui.prometheus.url | quote }}
        {{- end }}
        {{- if and .Values.gui.prometheus .Values.gui.prometheus.bearerTokenSecret .Values.gui.prometheus.bearerTokenSecret.name }}
        - name: PROMETHEUS_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.gui.prometheus.bearerTokenSecret.name | quote }}
              key: {{ .Values.gui.prometheus.bearerTokenSecret.key | default "token" | quote }}
        {{- end }}
        {{- with (include "dataflow-operator.sentryEnv" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.gui.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.gui.port }}
          protocol: TCP
        {{- include "dataflow-operator.httpProbes" (dict "port" "http" "path" "/") | nindent 8 }}
        resources:
          {{- toYaml .Values.gui.resources | nindent 12 }}
{{- end }}
